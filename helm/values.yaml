# kube-prometheus-stack values (release name: kps, namespace: monitoring)
fullnameOverride: kps

# kind exposes these control-plane components on localhost only,
# so scraping them just produces noisy "target down" alerts.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    # Pick up ServiceMonitors / PodMonitors / PrometheusRules from any
    # namespace, not only those labelled with the Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

grafana:
  adminPassword: admin   # local lab only - change for anything shared
  defaultDashboardsTimezone: browser
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

alertmanager:
  alertmanagerSpec:
    # Mounts Secret "alertmanager-slack" at
    # /etc/alertmanager/secrets/alertmanager-slack/
    secrets:
      - alertmanager-slack
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - channel: "#alerts"
            send_resolved: true
            api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: [alertname, namespace]
