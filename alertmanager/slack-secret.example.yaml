# Copy to alertmanager-slack.yaml (git-ignored), put your real webhook URL
# in, then: kubectl apply -f alertmanager-slack.yaml
# Or just run: SLACK_WEBHOOK_URL=https://hooks.slack.com/... make slack-secret
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack
  namespace: monitoring
type: Opaque
stringData:
  webhook-url: https://hooks.slack.com/services/REPLACE/ME/PLEASE
